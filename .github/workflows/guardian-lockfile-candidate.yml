name: Guardian lockfile repair candidate
on:
  push:
    branches:
      - fix/guardian-responsive-lockfile-20261121
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate lockfile without executing install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean installation with regenerated lockfile
        run: npm ci
      - name: Verify application build
        run: npm run build
      - name: Commit verified lockfile on isolated repair branch
        if: success()
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already consistent."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(lockfile): regenerate npm 22 dependency tree"
          git push origin HEAD:refs/heads/fix/guardian-responsive-lockfile-20261121
      - name: Export regenerated lockfile for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardian-package-lock-candidate
          path: package-lock.json
          if-no-files-found: error
