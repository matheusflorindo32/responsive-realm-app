name: Guardian lockfile repair candidate
on:
  push:
    branches:
      - fix/guardian-responsive-lockfile-20261121
permissions:
  contents: read
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate lockfile without executing install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean installation with regenerated lockfile
        run: npm ci
      - name: Verify application build
        run: npm run build
      - name: Export regenerated lockfile for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardian-package-lock-candidate
          path: package-lock.json
          if-no-files-found: error
